name: Version Release

on:
  push:
    branches:
      - release
    paths:
      - version.json

concurrency:
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-build:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      version: ${{ steps.meta.outputs.version }}
      date: ${{ steps.meta.outputs.date }}
      tag: ${{ steps.meta.outputs.tag }}
      archive_name: ${{ steps.meta.outputs.archive_name }}
      download_url: ${{ steps.meta.outputs.download_url }}
      author: ${{ steps.meta.outputs.author }}
      message: ${{ steps.meta.outputs.message }}
      branch: ${{ steps.meta.outputs.branch }}
      commit_url: ${{ steps.meta.outputs.commit_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect release metadata
        id: meta
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          current_version=$(jq -r '.version // empty' version.json)
          current_date=$(jq -r '.date // empty' version.json)
          author=$(git log -1 --pretty=format:'%an')
          message=$(git log -1 --pretty=format:'%s')
          branch="${GITHUB_REF#refs/heads/}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          previous_version=""
          if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}:version.json" 2>/dev/null; then
            previous_version=$(git show "${BEFORE_SHA}:version.json" | jq -r '.version // empty')
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1 && git cat-file -e "HEAD~1:version.json" 2>/dev/null; then
            previous_version=$(git show HEAD~1:version.json | jq -r '.version // empty')
          fi

          should_release=true
          if [ "$previous_version" = "$current_version" ]; then
            should_release=false
          fi

          tag="v${current_version}"
          archive_name="codec-v${current_version}.zip"
          download_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/${archive_name}"

          {
            echo "should_release=$should_release"
            echo "version=$current_version"
            echo "date=$current_date"
            echo "tag=$tag"
            echo "archive_name=$archive_name"
            echo "download_url=$download_url"
            echo "author=$author"
            echo "message=$message"
            echo "branch=$branch"
            echo "commit_url=$commit_url"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release Decision"
            echo ""
            echo "- Current version: ${current_version:-<empty>}"
            echo "- Previous version: ${previous_version:-<empty>}"
            echo "- Should release: ${should_release}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate release fields
        if: steps.meta.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.json version must match X.Y.Z, got '$VERSION'"
            exit 1
          fi

          if ! [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::version.json date must match YYYY-MM-DD, got '$RELEASE_DATE'"
            exit 1
          fi

      - name: Build release archive
        if: steps.meta.outputs.should_release == 'true'
        id: archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE_NAME: ${{ steps.meta.outputs.archive_name }}
        run: |
          set -euo pipefail

          archive_path="${RUNNER_TEMP}/${ARCHIVE_NAME}"
          git archive --format=zip --output "$archive_path" --prefix="codec-v${VERSION}/" "$GITHUB_SHA"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

          {
            echo "## Archive"
            echo ""
            echo "- File: ${ARCHIVE_NAME}"
            echo "- Path: ${archive_path}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        if: steps.meta.outputs.should_release == 'true'
        id: notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_DATE: ${{ steps.meta.outputs.date }}
          DOWNLOAD_URL: ${{ steps.meta.outputs.download_url }}
        run: |
          set -euo pipefail

          notes_path="${RUNNER_TEMP}/release-notes.md"
          cat <<EOF > "$notes_path"
          ## Release Info

          - Version: ${TAG}
          - Date: ${RELEASE_DATE}
          - Commit: \`${GITHUB_SHA}\`
          - Download: ${DOWNLOAD_URL}
          EOF

          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
          NOTES_PATH: ${{ steps.notes.outputs.notes_path }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            tag_sha=$(git rev-list -n 1 "$TAG")
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${TAG} already exists at ${tag_sha}, expected ${GITHUB_SHA}"
              exit 1
            fi
            tag_exists=true
          else
            tag_exists=false
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE_PATH" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES_PATH"
            action_result="updated"
          else
            if [ "$tag_exists" = "true" ]; then
              gh release create "$TAG" "$ARCHIVE_PATH" --title "$TAG" --notes-file "$NOTES_PATH"
            else
              gh release create "$TAG" "$ARCHIVE_PATH" --title "$TAG" --notes-file "$NOTES_PATH" --target "$GITHUB_SHA"
            fi
            action_result="created"
          fi

          {
            echo "## GitHub Release"
            echo ""
            echo "- Tag: ${TAG}"
            echo "- Result: ${action_result}"
          } >> "$GITHUB_STEP_SUMMARY"

  release-notify:
    name: Notify version release
    needs: release-build
    if: needs.release-build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.release-build.outputs.version }}
          RELEASE_DATE: ${{ needs.release-build.outputs.date }}
          BRANCH: ${{ needs.release-build.outputs.branch }}
          AUTHOR: ${{ needs.release-build.outputs.author }}
          MESSAGE: ${{ needs.release-build.outputs.message }}
          COMMIT_URL: ${{ needs.release-build.outputs.commit_url }}
          DOWNLOAD_URL: ${{ needs.release-build.outputs.download_url }}
        run: |
          set -euo pipefail

          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "Warning: FEISHU_WEBHOOK_URL secret is not configured, skipping notification"
            exit 0
          fi

          payload=$(jq -n \
            --arg version "v${VERSION}" \
            --arg date "$RELEASE_DATE" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg message "$MESSAGE" \
            --arg commit_url "$COMMIT_URL" \
            --arg download_url "$DOWNLOAD_URL" \
            '{
              msg_type: "interactive",
              card: {
                header: {
                  title: { tag: "plain_text", content: "新版本发布" },
                  template: "blue"
                },
                elements: [
                  {
                    tag: "div",
                    text: {
                      tag: "lark_md",
                      content: "**版本：** <font color=\"orange\">\($version)</font>\n**发布日期：** \($date)\n\n---\n\n**代码仓库：** \($repository)\n**分支：** <font color=\"blue\">\($branch)</font>\n**提交者：** \($author)\n**提交信息：** \($message)"
                    }
                  },
                  {
                    tag: "action",
                    actions: [
                      {
                        tag: "button",
                        text: { tag: "plain_text", content: "查看提交" },
                        url: $commit_url,
                        type: "primary"
                      },
                      {
                        tag: "button",
                        text: { tag: "plain_text", content: "下载版本包" },
                        url: $download_url,
                        type: "default"
                      }
                    ]
                  }
                ]
              }
            }')

          curl --fail --silent --show-error -X POST "$FEISHU_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$payload"
