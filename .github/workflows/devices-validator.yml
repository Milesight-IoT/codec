name: Devices Validator

on:
  push:
    branches:
      - '**'
    paths:
      - 'vendors/milesight-iot/devices.json'
  pull_request:
    branches:
      - '**'
    paths:
      - 'vendors/milesight-iot/devices.json'
  workflow_dispatch:

jobs:
  devices-validate:
    name: Validate devices.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new or modified devices for ipso_version
        id: check
        run: |
          FILE="vendors/milesight-iot/devices.json"
          HAS_ERROR=false

          check_duplicates() {
            local field=$1 label=$2
            local dups
            dups=$(jq -r ".devices[].$field" "$FILE" | sort | uniq -d)
            if [ -n "$dups" ]; then
              while IFS= read -r dup; do
                echo "::error::发现重复的设备 $label: ${dup}"
              done <<< "$dups"
              HAS_ERROR=true
            fi
          }

          check_duplicates id id
          check_duplicates name name

          while IFS= read -r device; do
            read -r id decoder encoder <<< "$(echo "$device" | jq -r '[.id, (.decoder_script // ""), (.encoder_script // "")] | @tsv')"
            for field_val in "decoder_script:$decoder" "encoder_script:$encoder"; do
              field="${field_val%%:*}"
              script_path="${field_val#*:}"
              [ -z "$script_path" ] && continue
              if [ ! -f "$script_path" ]; then
                echo "::error::${id}: ${field} 文件不存在 (${script_path})"
                HAS_ERROR=true
              fi
            done
          done <<< "$(jq -c '.devices[]' "$FILE")"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            OLD_REF="${{ github.event.pull_request.base.sha }}"
          else
            OLD_REF="${{ github.event.before }}"
            # 新分支首次 push 时 before 可能是全 0，回退到 HEAD~1（如果存在）
            if [ -z "$OLD_REF" ] || [ "$OLD_REF" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                OLD_REF="HEAD~1"
              else
                OLD_REF=""
              fi
            fi
          fi

          if [ -n "$OLD_REF" ] && git cat-file -e "$OLD_REF:$FILE" 2>/dev/null; then
            git show "$OLD_REF:$FILE" | jq -c '.devices[] | {(.id): .}' 2>/dev/null | jq -s 'add // {}' > /tmp/old_devices.json || echo '{}' > /tmp/old_devices.json
          else
            echo '{}' > /tmp/old_devices.json
          fi

          MISSING=""
          while IFS= read -r device; do
            id=$(echo "$device" | jq -r '.id')
            has_ipso=$(echo "$device" | jq 'has("ipso_version")')
            old_device=$(jq -c --arg id "$id" '.[$id] // empty' /tmp/old_devices.json)

            if [ -z "$old_device" ]; then
              if [ "$has_ipso" = "false" ]; then
                MISSING="${MISSING}${id}（新增）\n"
              fi
            else
              old_sorted=$(echo "$old_device" | jq -cS '.')
              new_sorted=$(echo "$device" | jq -cS '.')
              if [ "$old_sorted" != "$new_sorted" ] && [ "$has_ipso" = "false" ]; then
                MISSING="${MISSING}${id}（编辑）\n"
              fi
            fi
          done <<< "$(jq -c '.devices[]' "$FILE")"

          if [ -n "$MISSING" ]; then
            echo "missing_devices=$(echo -e "$MISSING" | sed '/^$/d' | paste -sd ',' -)" >> $GITHUB_OUTPUT
            echo "::error::以下新增或编辑的设备缺少 ipso_version 字段: $(echo -e "$MISSING" | sed '/^$/d' | paste -sd ',' -)"
            HAS_ERROR=true
          fi

          if [ "$HAS_ERROR" = "true" ]; then
            echo "has_error=true" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "has_error=false" >> $GITHUB_OUTPUT
            echo "所有校验均通过"
          fi

  devices-notify:
    name: Notify devices validation failure
    needs: devices-validate
    if: always() && failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get missing devices info
        id: info
        run: |
          FILE="vendors/milesight-iot/devices.json"
          ERRORS=""

          collect_duplicates() {
            local field=$1 label=$2
            local dups
            dups=$(jq -r ".devices[].$field" "$FILE" | sort | uniq -d)
            if [ -n "$dups" ]; then
              while IFS= read -r dup; do
                ERRORS="${ERRORS}- 重复 $label: ${dup}\n"
              done <<< "$dups"
            fi
          }

          collect_duplicates id id
          collect_duplicates name name

          while IFS= read -r device; do
            read -r id decoder encoder <<< "$(echo "$device" | jq -r '[.id, (.decoder_script // ""), (.encoder_script // "")] | @tsv')"
            for field_val in "decoder_script:$decoder" "encoder_script:$encoder"; do
              field="${field_val%%:*}"
              script_path="${field_val#*:}"
              [ -z "$script_path" ] && continue
              if [ ! -f "$script_path" ]; then
                ERRORS="${ERRORS}- ${id}: ${field} 文件不存在\n"
              fi
            done
          done <<< "$(jq -c '.devices[]' "$FILE")"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            OLD_REF="${{ github.event.pull_request.base.sha }}"
          else
            OLD_REF="${{ github.event.before }}"
            if [ -z "$OLD_REF" ] || [ "$OLD_REF" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                OLD_REF="HEAD~1"
              else
                OLD_REF=""
              fi
            fi
          fi

          if [ -n "$OLD_REF" ] && git cat-file -e "$OLD_REF:$FILE" 2>/dev/null; then
            git show "$OLD_REF:$FILE" | jq -c '.devices[] | {(.id): .}' 2>/dev/null | jq -s 'add // {}' > /tmp/old_devices.json || echo '{}' > /tmp/old_devices.json
          else
            echo '{}' > /tmp/old_devices.json
          fi

          while IFS= read -r device; do
            id=$(echo "$device" | jq -r '.id')
            has_ipso=$(echo "$device" | jq 'has("ipso_version")')
            old_device=$(jq -c --arg id "$id" '.[$id] // empty' /tmp/old_devices.json)

            if [ -z "$old_device" ]; then
              if [ "$has_ipso" = "false" ]; then
                ERRORS="${ERRORS}- ${id}（新增）缺少 ipso_version\n"
              fi
            else
              old_sorted=$(echo "$old_device" | jq -cS '.')
              new_sorted=$(echo "$device" | jq -cS '.')
              if [ "$old_sorted" != "$new_sorted" ] && [ "$has_ipso" = "false" ]; then
                ERRORS="${ERRORS}- ${id}（编辑）缺少 ipso_version\n"
              fi
            fi
          done <<< "$(jq -c '.devices[]' "$FILE")"

          echo "error_list<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ERRORS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK_URL }}
          ERROR_LIST: ${{ steps.info.outputs.error_list }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -n "$FEISHU_WEBHOOK" ]; then
            payload=$(jq -n \
              --arg error_list "$ERROR_LIST" \
              --arg repository "$REPOSITORY" \
              --arg branch "$BRANCH" \
              --arg actor "$ACTOR" \
              --arg commit_msg "$COMMIT_MSG" \
              --arg commit_url "$COMMIT_URL" \
              --arg actions_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{
                msg_type: "interactive",
                card: {
                  header: {
                    title: { tag: "plain_text", content: "Devices 校验失败" },
                    template: "red"
                  },
                  elements: [
                    {
                      tag: "div",
                      text: {
                        tag: "lark_md",
                        content: "**错误详情：**\n\($error_list)\n\n---\n\n**代码仓库：** \($repository)\n**分支：** <font color=\"orange\">\($branch)</font>\n**提交者：** \($actor)\n**提交信息：** \($commit_msg)"
                      }
                    },
                    {
                      tag: "action",
                      actions: [
                        {
                          tag: "button",
                          text: { tag: "plain_text", content: "查看 Actions" },
                          url: $actions_url,
                          type: "primary"
                        },
                        {
                          tag: "button",
                          text: { tag: "plain_text", content: "查看提交" },
                          url: $commit_url,
                          type: "default"
                        }
                      ]
                    }
                  ]
                }
              }')
            curl --fail --silent --show-error -X POST "$FEISHU_WEBHOOK" \
              -H 'Content-Type: application/json' \
              -d "$payload"
          else
            echo "Warning: FEISHU_WEBHOOK_URL secret is not configured, skipping notification"
          fi
