name: WeChat Work Notification

on:
  push:
    branches:
      - '**'  # 监听所有分支的推送

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 获取最近两个提交以便比较

      - name: Get commit info
        id: commit_info
        run: |
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "sha=$(git log -1 --pretty=format:'%h')" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Send WeChat Work notification
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          curl -X POST "$WECHAT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## 📦 代码推送通知\n> 仓库：**${{ github.repository }}**\n> 分支：<font color=\\\"info\\\">${{ steps.commit_info.outputs.branch }}</font>\n> 提交者：${{ steps.commit_info.outputs.author }}\n> 提交信息：${{ steps.commit_info.outputs.message }}\n> 提交SHA：\`${{ steps.commit_info.outputs.sha }}\`\n\n[查看详情](${{ github.event.head_commit.url }})\"
              }
            }"
