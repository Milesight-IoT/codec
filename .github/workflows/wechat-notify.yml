name: WeChat Work Notification

on:
  push:
    branches:
      - '**'
    paths:
      - 'version.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit info and version
        id: commit_info
        run: |
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=format:'%s')" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "version=$(jq -r '.version' version.json)" >> $GITHUB_OUTPUT
          echo "date=$(jq -r '.date' version.json)" >> $GITHUB_OUTPUT
          echo "link=$(jq -r '.link' version.json)" >> $GITHUB_OUTPUT

      - name: Send WeChat Work notification
        env:
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: |
          curl -X POST "$WECHAT_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## New Version Released\n\n**Version:** <font color=\\\"warning\\\">v${{ steps.commit_info.outputs.version }}</font>\n**Release Date:** ${{ steps.commit_info.outputs.date }}\n\n────────────────\n\n**Repository:** ${{ github.repository }}\n**Branch:** <font color=\\\"info\\\">${{ steps.commit_info.outputs.branch }}</font>\n**Author:** ${{ steps.commit_info.outputs.author }}\n**Commit:** ${{ steps.commit_info.outputs.message }}\n\n────────────────\n\n[Download Latest](${{ steps.commit_info.outputs.link }})  |  [View Commit](${{ github.event.head_commit.url }})\"
              }
            }"
